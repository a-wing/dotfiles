# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{

font_family      Cascadia Code PL SemiBold
font_family      CaskaydiaCove Nerd Font Mono SemiBold

# https://github.com/folke/dot/blob/f5ba84b3a73a4e2aa4648c14707ce6847c29169b/config/kitty/kitty.conf#L13
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D2,U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E634,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF CaskaydiaCove Nerd Font Mono

font_size 13.0

#: }}}

#: Mouse {{{

mouse_hide_wait 3.0

#: }}}

#: Terminal bell {{{

enable_audio_bell no

#: }}}

#: Color scheme {{{

foreground #d5ffd5
background_image ~/Pictures/background.png
background_image_layout centered
background_tint 0.95

#: }}}

